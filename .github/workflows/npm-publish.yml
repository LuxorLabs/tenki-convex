name: Release

# Publishes @tenkicloud/convex to npm. Only a pushed v* tag publishes, and the tag
# must match package.json's version and point at a commit on main.
#
#   npm version 0.1.1 --no-git-tag-version
#   git commit -am "@tenkicloud/convex 0.1.1"
#   git tag -a v0.1.1 -m "@tenkicloud/convex 0.1.1"
#   git push origin main --follow-tags   # pushes annotated tags only
#
# The publish job stages the version through npm trusted publishing (GitHub OIDC,
# no token). It goes live only when a maintainer of @tenkicloud/convex approves it
# with 2FA: `npm stage approve <stage-id>`, or Staged Packages on npmjs.com. The
# trusted publisher on npmjs.com names this workflow file (npm-publish.yml) and
# the npm-publish environment, and only needs to allow `npm stage publish`.
#
# The build job runs every gate and packs the tarball without id-token, since it
# runs dependency code. The publish job installs nothing and stages that
# tarball. Running the workflow from the Actions tab is always a dry run: only
# the build job runs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      npm_name: ${{ steps.ver.outputs.npm_name }}
      version: ${{ steps.ver.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the main check needs origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .nvmrc
          cache-dependency-path: package.json
          cache: "npm"

      - run: npm ci

      - name: Verify the tag matches package.json
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG=$(node -p "require('./package.json').version")
          fi
          node - "$TAG" "${{ github.event_name }}" <<'JS'
          const [tag, event] = process.argv.slice(2);
          const pkg = require("./package.json");
          if (pkg.version !== tag) {
            console.error(`::error::package.json version ${pkg.version} != tag ${tag}`);
            process.exitCode = 1;
          }
          if (pkg.private) {
            // npm refuses to publish a private package; say why before trying.
            const level = event === "push" ? "error" : "warning";
            console.error(`::${level}::package.json has "private": true; remove it to publish`);
            if (level === "error") process.exitCode = 1;
          }
          JS
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "npm_name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that isn't on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main && exit 0
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::${GITHUB_REF_NAME} doesn't point at a commit on main"
            exit 1
          fi
          echo "::warning::${GITHUB_REF_NAME} isn't on main; a tag here would be refused"

      - name: Refuse a version that is already on npm
        env:
          PKG: ${{ steps.ver.outputs.npm_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${PKG}/${VERSION}" || echo 000)
          case "$code" in
            404) ;;
            200) echo "::error::${PKG}@${VERSION} is already published; bump the version"; exit 1 ;;
            *) echo "::error::couldn't check npm for ${PKG}@${VERSION} (HTTP ${code}); rerun"; exit 1 ;;
          esac

      - run: npm run build

      # Packed and uploaded before the steps below, which run unpinned code
      # (pack:check installs the latest convex and typescript) that could
      # otherwise rewrite dist/. Built above, so no lifecycle scripts.
      - name: Pack the tarball that will be published
        id: pack
        run: |
          set -euo pipefail
          tarball=$(npm pack --ignore-scripts | tail -1)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$tarball" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Test, typecheck and lint
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Check the packed package
        run: npm run pack:check

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      - name: Dry run summary
        if: always() && github.event_name != 'push'
        run: |
          {
            echo "### @tenkicloud/convex release (dry run)"
            echo ""
            echo "- gates: ${{ job.status }}"
            echo "- tarball: \`${{ steps.pack.outputs.tarball }}\`"
            echo "- published: no; only a pushed v* tag publishes"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: github.event_name == 'push'
    # GitHub-hosted on purpose: npm supports neither provenance nor trusted
    # publishing from self-hosted runners.
    runs-on: ubuntu-latest
    # The trusted publisher names this environment, and the environment only
    # accepts v* tags. The human approval is the 2FA approve on npm.
    environment: npm-publish
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      # npm doesn't support provenance from private repositories.
      PROVENANCE:
        ${{ github.event.repository.private && '--no-provenance' ||
        '--provenance' }}
      PKG: ${{ needs.build.outputs.npm_name }}
      VERSION: ${{ needs.build.outputs.version }}
      TARBALL: ${{ needs.build.outputs.tarball }}
      SHA256: ${{ needs.build.outputs.sha256 }}

    steps:
      # This job doesn't check out the repo, so it can't read .nvmrc; keep this
      # on the same major.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package

      # The hash was taken right after packing, before the build job ran any
      # unpinned code, so a re-uploaded artifact can't be published.
      - name: Verify the tarball is the one the build packed
        run: echo "${SHA256}  ${TARBALL}" | sha256sum -c -

      # Nothing goes live from here: npm keeps the version staged until a
      # maintainer approves it with 2FA, and a stage can be rejected instead.
      - name: Stage on npm (trusted publishing)
        id: stage
        run: |
          set -euo pipefail
          # Staged publishing needs npm >= 11.15.0. Node 24 bundles npm 11, so this
          # normally passes; it fails loudly rather than falling back silently.
          # shellcheck disable=SC2016 # the single-quoted script is JavaScript
          node -e 'const p=s=>s.split(/[.-]/).slice(0,3).map(Number),[x,y]=[p(process.argv[1]),p("11.15.0")];
            for(let i=0;i<3;i++){if(x[i]>y[i])process.exit(0);if(x[i]<y[i]){
              console.error(`::error::npm ${process.argv[1]} < 11.15.0; staged publishing unavailable`);process.exit(1);}}' "$(npm --version)"
          npm stage publish "./${TARBALL}" "$PROVENANCE" --access public --ignore-scripts | tee "$RUNNER_TEMP/stage.out"
          echo "stage_id=$(sed -n 's/.*(staged with id \([0-9a-f-]*\)).*/\1/p' "$RUNNER_TEMP/stage.out")" >> "$GITHUB_OUTPUT"

      - name: Release summary
        if: always()
        env:
          STAGE_ID: ${{ steps.stage.outputs.stage_id }}
        run: |
          {
            echo "### @tenkicloud/convex ${VERSION}"
            echo ""
            echo "- staged: ${{ steps.stage.outcome == 'success' && 'yes' || 'no' }}"
            echo "- provenance: \`${PROVENANCE}\`"
            if [ -n "${STAGE_ID}" ]; then
              echo ""
              echo "Not live yet. A maintainer of ${PKG} approves it with 2FA:"
              echo ""
              echo "    npm stage approve ${STAGE_ID}"
              echo ""
              echo "or under Staged Packages on npmjs.com. Reject it with \`npm stage reject ${STAGE_ID}\`."
            elif [ "${{ steps.stage.outcome }}" = "success" ]; then
              echo ""
              echo "Not live yet. Find the stage id with \`npm stage list ${PKG}\` and approve it with 2FA."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
