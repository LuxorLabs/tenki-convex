name: Release

# Publishes @tenkicloud/convex to npm. Only a pushed v* tag publishes, and the tag
# must match package.json's version and point at a commit on main: npm publish is
# irreversible, so the workflow refuses to publish otherwise.
#
#   npm version 0.1.1 --no-git-tag-version
#   git commit -am "@tenkicloud/convex 0.1.1"
#   git tag -a v0.1.1 -m "@tenkicloud/convex 0.1.1"
#   git push origin main --follow-tags   # pushes annotated tags only
#
# Publishing is keyless (npm trusted publishing via GitHub OIDC): the trusted
# publisher for @tenkicloud/convex on npmjs.com points at this exact workflow
# file (npm-publish.yml) and the npm-publish environment, the same convention as
# tenki-mcp and tenki-composio-tools. A trusted publisher can't be set up for a
# package that doesn't exist yet, so the NPM_TOKEN environment secret is a
# bootstrap for the first version only: while it is set the workflow uses it,
# and once it is deleted the keyless path takes over with no workflow change.
#
# The build job runs every gate and packs the tarball without id-token, since it
# runs dependency code. The publish job installs nothing and publishes that
# tarball. Running the workflow from the Actions tab is always a dry run: only
# the build job runs.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      npm_name: ${{ steps.ver.outputs.npm_name }}
      version: ${{ steps.ver.outputs.version }}
      tarball: ${{ steps.pack.outputs.tarball }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # the main check needs origin/main

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          cache-dependency-path: package.json
          cache: "npm"

      - run: npm ci

      - name: Verify the tag matches package.json
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME#v}"
          else
            TAG=$(node -p "require('./package.json').version")
          fi
          node - "$TAG" "${{ github.event_name }}" <<'JS'
          const [tag, event] = process.argv.slice(2);
          const pkg = require("./package.json");
          if (pkg.version !== tag) {
            console.error(`::error::package.json version ${pkg.version} != tag ${tag}`);
            process.exitCode = 1;
          }
          if (pkg.private) {
            // npm refuses to publish a private package; say why before trying.
            const level = event === "push" ? "error" : "warning";
            console.error(`::${level}::package.json has "private": true; remove it to publish`);
            if (level === "error") process.exitCode = 1;
          }
          JS
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "npm_name=$(node -p 'require("./package.json").name')" >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that isn't on main
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main && exit 0
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "::error::${GITHUB_REF_NAME} doesn't point at a commit on main"
            exit 1
          fi
          echo "::warning::${GITHUB_REF_NAME} isn't on main; a tag here would be refused"

      - name: Refuse a version that is already on npm
        env:
          PKG: ${{ steps.ver.outputs.npm_name }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${PKG}/${VERSION}" || echo 000)
          case "$code" in
            404) ;;
            200) echo "::error::${PKG}@${VERSION} is already published; bump the version"; exit 1 ;;
            *) echo "::error::couldn't check npm for ${PKG}@${VERSION} (HTTP ${code}); rerun"; exit 1 ;;
          esac

      - run: npm run build

      - name: Test, typecheck and lint
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Check the packed package
        run: npm run pack:check

      - name: Dependency audit (production deps)
        run: npm audit --omit=dev --audit-level=high

      # Built above, so no lifecycle scripts; npm lists the tarball's contents.
      - name: Pack the tarball that will be published
        id: pack
        run: |
          set -euo pipefail
          tarball=$(npm pack --ignore-scripts | tail -1)
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

      - name: Dry run summary
        if: always() && github.event_name != 'push'
        run: |
          {
            echo "### @tenkicloud/convex release (dry run)"
            echo ""
            echo "- gates: ${{ job.status }}"
            echo "- tarball: \`${{ steps.pack.outputs.tarball }}\`"
            echo "- published: no; only a pushed v* tag publishes"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: build
    if: github.event_name == 'push'
    # GitHub-hosted on purpose: npm supports neither provenance nor trusted
    # publishing from self-hosted runners.
    runs-on: ubuntu-latest
    # Each publish waits for an approval from the environment's required
    # reviewers. The npm trusted-publisher config must name this environment.
    environment: npm-publish
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    env:
      # npm doesn't support provenance from private repositories.
      PROVENANCE:
        ${{ github.event.repository.private && '--no-provenance' ||
        '--provenance' }}
      PKG: ${{ needs.build.outputs.npm_name }}
      VERSION: ${{ needs.build.outputs.version }}
      TARBALL: ${{ needs.build.outputs.tarball }}

    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: package

      # The secrets context isn't allowed in a step's if:, so this step turns the
      # secret's presence into an output. The token itself only reaches the
      # bootstrap publish step.
      - name: Pick the publish path
        id: auth
        env:
          HAS_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
        run: echo "bootstrap=${HAS_TOKEN}" >> "$GITHUB_OUTPUT"

      # ── Irreversible from here ────────────────────────────────────────────────

      - name: Publish to npm (bootstrap, NPM_TOKEN present)
        id: bootstrap
        if: steps.auth.outputs.bootstrap == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run:
          npm publish "./${TARBALL}" "$PROVENANCE" --access public
          --ignore-scripts

      - name: Publish to npm (trusted publishing, keyless)
        id: keyless
        if: steps.auth.outputs.bootstrap == 'false'
        run: |
          set -euo pipefail
          # Trusted publishing needs npm >= 11.5.1. Node 24 bundles npm 11, so this
          # normally passes; it fails loudly rather than falling back silently.
          # shellcheck disable=SC2016 # the single-quoted script is JavaScript
          node -e 'const p=s=>s.split(/[.-]/).slice(0,3).map(Number),[x,y]=[p(process.argv[1]),p("11.5.1")];
            for(let i=0;i<3;i++){if(x[i]>y[i])process.exit(0);if(x[i]<y[i]){
              console.error(`::error::npm ${process.argv[1]} < 11.5.1; trusted publishing unavailable`);process.exit(1);}}' "$(npm --version)"
          npm publish "./${TARBALL}" "$PROVENANCE" --access public --ignore-scripts

      - name: Wait for npm to serve the new version
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${PKG}/${VERSION}" || echo 000)
            if [ "$code" = "200" ]; then echo "npm is serving ${PKG}@${VERSION}"; exit 0; fi
            echo "attempt ${i}/30: HTTP ${code}"; sleep 10
          done
          echo "::error::npm did not serve ${PKG}@${VERSION} within 5 minutes"
          exit 1

      - name: Publish summary
        if: always()
        run: |
          {
            echo "### @tenkicloud/convex release"
            echo ""
            echo "- version: \`${VERSION}\`"
            echo "- published: ${{ (steps.bootstrap.outcome == 'success' || steps.keyless.outcome == 'success') && 'yes' || 'no' }}"
            echo "- npm: https://www.npmjs.com/package/${PKG}/v/${VERSION}"
            echo "- provenance: \`${PROVENANCE}\`"
            echo ""
            echo "Trusted publisher config on npmjs.com: org LuxorLabs, repo tenki-convex,"
            echo "workflow npm-publish.yml, environment npm-publish. If NPM_TOKEN is still"
            echo "set as a secret, delete it and revoke the token; keyless OIDC takes over."
          } >> "$GITHUB_STEP_SUMMARY"
