name: E2E
on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

# One group per event and ref: a newer push supersedes its own pending run, and
# runs for different refs proceed. A run keeps at most 2 sandboxes alive, so two
# overlapping runs fit the Test workspace's 5 active sandboxes.
concurrency:
  group: e2e-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  e2e:
    name: E2E against Tenki
    # Fork PRs never get repository secrets, so the suite can't run there. Don't
    # reach for pull_request_target to change that: it would run the fork's code
    # with TENKI_API_KEY.
    if:
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CONVEX_AGENT_MODE: anonymous
      CONVEX_URL: http://127.0.0.1:3210
      E2E_SLOW: ${{ github.event_name == 'schedule' && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Node setup
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          cache-dependency-path: package.json
          node-version: "24.x"
          cache: "npm"

      - name: Install and build
        run: |
          npm ci
          npm run build

      - name: Start a local Convex backend
        run: |
          npx convex init
          cat .env.local
          npx convex dev --typecheck disable > convex-dev.log 2>&1 &
          for i in $(seq 1 120); do
            grep -q "functions ready" convex-dev.log && break
            if grep -q "✖" convex-dev.log; then cat convex-dev.log; exit 1; fi
            sleep 1
          done
          grep -q "functions ready" convex-dev.log || { cat convex-dev.log; exit 1; }

      # TENKI_API_KEY is mapped only into the steps that use it, so install
      # scripts and the build never see it. This can't join the step above:
      # `convex dev` keeps running in the background with that step's env, so
      # it, the local backend and esbuild would hold the key for the whole job.
      - name: Configure the backend
        env:
          TENKI_API_KEY: ${{ secrets.TENKI_API_KEY }}
        run: |
          printf '%s' "$TENKI_API_KEY" | npx convex env set TENKI_API_KEY
          npx convex env set TENKI_E2E 1

      - name: Run e2e
        env:
          TENKI_API_KEY: ${{ secrets.TENKI_API_KEY }}
        run: npm run e2e

      - name: Backend log
        if: failure()
        run: cat convex-dev.log
